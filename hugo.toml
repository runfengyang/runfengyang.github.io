baseURL = 'https://runfengyang.github.io/'
languageCode = 'en-us'
title = 'Runfeng (Jerry) Yang'
theme = 'typo'

# Google analytics code
googleAnalytics = "G-EDWRV05M8Y"

[taxonomies]
tag = 'tags'

[params]
# Meta description
description = "A Research Blog"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page  
homeIntroTitle = 'Hola!'  
homeIntroContent = """  
Welcome to my personal website! Here, you'll find my research, projects, and other updates about my life.  \\
Feel free to read [about myself](/about) or to look at my [research](/research).

"""


# Collection to display on home
#homeCollectionTitle = 'Posts'
#homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = false
listDateFormat = '2 Jan 2006'

# Breadcrumbs
[params.breadcrumbs]
enabled = true
showCurrentPage = true
home = "Home"

# Social icons
[[params.social]]
name = "linkedin"
url = "https://www.linkedin.com/in/runfeng-yang-cfa-54b7a0a7"
 
#[[params.social]]
#name = "github"
#url = "https://github.com/user"

# Main menu pages
#[[params.menu]]
#name = "home"
#url = "/"

[[params.menu]]
name = "about"
url = "/about"

[[params.menu]]
name = "research"
url = "/research"

[[params.menu]]
name = "photos"
url = "/photography"

# Syntax highlight on code blocks
[markup]
[markup.highlight]
style = 'algol'

# Giscus comments
[params.giscus]
enable = false
repo = "user/repo"
repoid = "repoId"
category = "General"
categoryid = "categoryId"
mapping = "pathname"
theme = "preferred_color_scheme"

# Other setting
[markup.goldmark.renderer]
  unsafe = true  # Enables raw HTML in Markdown


